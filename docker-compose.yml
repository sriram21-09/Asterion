services:
  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    ports:
      - "8222:8222"
    environment:
      - ENV=development
      - PORT=8222
    volumes:
      - ./backend/app/data:/app/data
    restart: always
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8222/api/v1/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
      args:
        # Browser-side API URL (client requests from host browser to host-mapped port)
        - VITE_API_URL=http://localhost:8222/api/v1
        # Server-side / Proxy API URL (container-to-container via Docker network)
        - VITE_API_BASE_URL=http://backend:8222/api/v1
        - VITE_BACKEND_URL=http://backend:8222
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    restart: always
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
